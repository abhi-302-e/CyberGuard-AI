version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: cyberguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberguard_user
      POSTGRES_PASSWORD: cyberguard_secure_password_2026
      POSTGRES_DB: cyberguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberguard_user -d cyberguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker & Rate Limiting Cache
  redis:
    image: redis:7-alpine
    container_name: cyberguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # 3. Python FastAPI Multi-Agent Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberguard-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
      - "5000:5000"
    environment:
      - CYBERGUARD_ENV=production
      - CYBERGUARD_LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://cyberguard_user:cyberguard_secure_password_2026@db:5432/cyberguard_db
      - REDIS_URL=redis://redis:6379/0
      - CYBERGUARD_SECRET=cg-autonomous-defense-key-2026
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
