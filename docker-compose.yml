version: '3.8'

services:
  cyberguard-soc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberguard-ai-soc
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "8080:8080"
    environment:
      - CYBERGUARD_ENV=production
      - CYBERGUARD_LOG_LEVEL=INFO
      - CYBERGUARD_UI_PORT=5000
      - CYBERGUARD_API_PORT=8080
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
