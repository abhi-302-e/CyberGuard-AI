name: CyberGuard AI CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask pytest streamlit altair pandas

      - name: Run Core Multi-Agent Unit & Orchestration Tests
        run: |
          python -m unittest discover tests

      - name: Run Backend Services & Integration Tests
        run: |
          python -m unittest discover backend/tests

      - name: Validate Streamlit Command Center
        run: |
          python -m py_compile streamlit_app.py

      - name: Execute End-to-End Autonomous Simulation Scenarios
        run: |
          python run_simulation.py storm_2603
          python run_simulation.py sshole
          python run_simulation.py has_ransomware
          python run_simulation.py rogue_ai
          python run_simulation.py benign

